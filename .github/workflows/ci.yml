name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04
          - macos-latest
          - macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run release acceptance checks
        run: go test ./test/acceptance -run TestRelease -count=1

      - name: Run binary-safe secret canary scan
        run: go run ./cmd/envvault-ci secret-scan .

  agent-infra-bridge:
    name: Agent-infra bridge protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build in-memory mock plugin
        run: go build -o "$RUNNER_TEMP/envvault-bridge-mock-plugin" ./examples/agent-infra-bridge/testdata/mock-plugin

      - name: Test bridge and real broker without provider credentials
        env:
          ENVVAULT_BRIDGE_TEST_PLUGIN: ${{ runner.temp }}/envvault-bridge-mock-plugin
        run: node --test examples/agent-infra-bridge/test/*.test.mjs

  microsandbox:
    name: Microsandbox helper builds
    uses: ./.github/workflows/microsandbox-helper.yml
    with:
      version: v0.0.0-ci

  sandbox-scripts:
    name: Sandbox script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check experimental launchers and public credential helper
        run: |
          node --check examples/gondolin/codex.mjs
          node --check examples/gondolin/smoke.mjs
          node --check examples/microsandbox/git-credential-envvault
          sh -n examples/microsandbox/agent
          sh -n examples/microsandbox/agent-entrypoint
          sh -n examples/microsandbox/install
          python3 -c 'import ast; ast.parse(open("examples/microsandbox/check-sessions.py").read())'

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build
